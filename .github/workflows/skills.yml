name: Skills Validation
on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *" # daily: catch drift between this CLI and api7/agent-skills
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-skills:
    name: Skills Metadata & Command Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out api7/agent-skills
        uses: actions/checkout@v4
        with:
          repository: api7/agent-skills
          path: agent-skills

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.0"

      - name: Test skills
        run: make test-skills
        env:
          SKILLS_DIR: ${{ github.workspace }}/agent-skills/skills/a7
